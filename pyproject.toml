[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ae-mcp"
version = "1.0.0"
description = "Production-grade Model Context Protocol (MCP) integration connecting LLMs directly to Adobe After Effects on Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ae-mcp contributors" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "adobe",
    "after-effects",
    "extendscript",
    "motion-graphics",
    "automation",
    "ai"
]
dependencies = [
    "mcp>=1.2.0",
    "fastmcp>=0.1.0",
    "pywin32>=306; sys_platform == 'win32'",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "rembg>=2.0.50",
    "onnxruntime>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "flake8>=6.0.0",
]

[project.scripts]
ae-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bridge*", "extendscript*", "templates*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
